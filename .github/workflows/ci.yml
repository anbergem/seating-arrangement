name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm build
      # The browser suite runs this exact output, and so does the promotion: CI
      # builds once (D21). `.output/` is the Nitro Node server — there is no
      # Worker bundle any more, and no hidden asset-manifest file to carry.
      - uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: .output/
          retention-days: 7
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: server-build
          path: .output
      - run: pnpm exec playwright install --with-deps chromium
      # The e2e server migrates a private SQLite file, seeds the scenario and
      # runs the smoke from the global setup (B18, B20).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
