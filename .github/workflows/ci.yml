name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm build
      # The browser suite runs this exact output, and so does the promotion: CI
      # builds once (D21). `.output/` is the Nitro Node server — there is no
      # Worker bundle any more, and no hidden asset-manifest file to carry.
      - uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: .output/
          # `.output` is a dotfile, and upload-artifact@v4 skips hidden paths
          # unless told otherwise: without this the step only warns ("No files
          # were found") and the e2e job fails one step later, downloading an
          # artifact that was never made.
          include-hidden-files: true
          # Nothing downstream rebuilds this, so a missing build must fail the
          # job that was supposed to make it, not the one that reads it.
          if-no-files-found: error
          retention-days: 7
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The browser suite runs the production build, which the framework will not
    # start on PGlite, so it gets a real PostgreSQL — the add-on's major version.
    # The launcher creates and drops its own database on it per run.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: server-build
          path: .output
      - run: pnpm exec playwright install --with-deps chromium
      # The e2e server creates a throwaway database on the service above,
      # migrates and seeds it, and runs the smoke from the global setup (B18, B20).
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
