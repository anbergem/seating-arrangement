name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-staging
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      CLEVER_APP_NAME: ${{ vars.CLEVER_APP_NAME }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      # First, and before install or build: this is the only step that needs no
      # repository, and it exercises the exact pairing a wrong credential
      # breaks. A stale Cloudflare token once sent the first real deployment
      # through three minutes of install, build and two artifact uploads before
      # failing with a bare "[code: 7403]" (DISCREPANCIES.md, 2026-09-14); the
      # platform changed, the lesson did not.
      - name: Preflight — the Clever Cloud credentials work
        run: |
          if ! npx --yes clever-tools@latest profile > /dev/null 2>&1; then
            echo "::error::CLEVER_TOKEN / CLEVER_SECRET are not accepted by Clever Cloud."
            echo "Re-set them with: node scripts/bootstrap.mjs --yes --only github-secrets"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # `clever deploy` pushes this repository to the platform's git remote,
          # which needs the commit's ancestry, not just its tree.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Initialize temporary paths
        run: |
          {
            echo "CI_RUN_JSON=$RUNNER_TEMP/ci-run.json"
            echo "DEPLOYMENT_MANIFEST=$RUNNER_TEMP/deployment-manifest.json"
          } >> "$GITHUB_ENV"
      - name: Read triggering CI run
        if: github.event_name == 'workflow_run'
        env:
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_CI_RUN_ID" > "$CI_RUN_JSON"
      - name: Find exact CI run for manual deployment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method GET
          "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&branch=main&status=success&per_page=100"
          > "$CI_RUN_JSON"
      - name: Validate exact CI run
        id: ci
        run: node scripts/validate-ci-run.mjs
      - name: Write immutable deployment manifest
        env:
          SOURCE_CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: node scripts/write-deployment-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: ${{ env.DEPLOYMENT_MANIFEST }}
          retention-days: 90
      - run: pnpm install --frozen-lockfile
      - name: Link this checkout to the staging application
        run: npx --yes clever-tools@latest link "$CLEVER_APP_NAME" --alias staging
      # Before the deploy, not after: a migration that fails must fail the
      # deployment rather than take a running application down with it. The
      # connection string is fetched in-process by `--addon` and never reaches a
      # log, a command line or a GitHub variable.
      - name: Apply migrations
        run: node scripts/migrate.mjs --addon "$CLEVER_APP_NAME-db"
      - name: Deploy
        run: >-
          npx --yes clever-tools@latest deploy --alias staging
          --same-commit-policy restart
      - name: Reset QA scenario
        run: >-
          node scripts/seed.mjs --addon "$CLEVER_APP_NAME-db" --reset
          --base-url "$STAGING_URL"
      - name: Smoke staging
        run: >-
          node scripts/smoke.mjs --base-url "$STAGING_URL" --mode staging
          --qa-email owner@example.invalid --qa-password "$SEED_PASSWORD"
          --expect-org-id org_acme --timeout-ms 300000
      - name: Record deployment
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          {
            echo "### Staging deployment"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- Source CI run: \`$SOURCE_CI_RUN_ID\`"
            echo "- Promotion artifact: \`server-build\` from that run"
            echo "- Deploy and smoke: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
