name: Deploy production
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy staging workflow run id
        required: true
        type: string
      confirm:
        description: Type deploy to promote this exact commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  promote:
    if: inputs.confirm == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLEVER_TOKEN: ${{ secrets.CLEVER_TOKEN }}
      CLEVER_SECRET: ${{ secrets.CLEVER_SECRET }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      CLEVER_APP_NAME: ${{ vars.CLEVER_APP_NAME }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
    steps:
      - name: Validate run id
        shell: bash
        run: '[[ "$STAGING_RUN_ID" =~ ^[1-9][0-9]*$ ]]'
      # First, before anything else: the one step that needs no repository, and
      # it exercises the exact pairing a wrong credential breaks. A stale
      # Cloudflare token once sent a promotion through three minutes of install
      # and build before failing on a bare "[code: 7403]"
      # (DISCREPANCIES.md, 2026-09-14). The platform changed; the lesson did not.
      - name: Preflight — the Clever Cloud credentials work
        run: |
          if ! npx --yes clever-tools@latest profile > /dev/null 2>&1; then
            echo "::error::CLEVER_TOKEN / CLEVER_SECRET are not accepted by Clever Cloud."
            echo "Re-set them with: node scripts/bootstrap.mjs --yes --only github-secrets"
            exit 1
          fi
      - name: Initialize temporary paths
        run: |
          {
            echo "STAGING_RUN_JSON=$RUNNER_TEMP/staging-run.json"
            echo "CI_RUN_JSON=$RUNNER_TEMP/ci-run.json"
            echo "DEPLOYMENT_MANIFEST=$RUNNER_TEMP/deployment-manifest/deployment-manifest.json"
            echo "BACKUPS_JSON=$RUNNER_TEMP/backups.json"
            echo "PREVIOUS_DEPLOYMENTS_JSON=$RUNNER_TEMP/previous-deployments.txt"
          } >> "$GITHUB_ENV"
      - name: Read staging run metadata
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$STAGING_RUN_JSON"
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
      - name: Download deployment manifest
        run: >-
          gh run download "$STAGING_RUN_ID" --repo "$GITHUB_REPOSITORY"
          --name deployment-manifest --dir "$RUNNER_TEMP/deployment-manifest"
      - name: Read source CI metadata
        run: |
          source_ci_run_id=""
          source_ci_run_id="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.env.DEPLOYMENT_MANIFEST,"utf8")); if (!/^[1-9][0-9]*$/.test(String(p.sourceCiRunId))) process.exit(1); process.stdout.write(String(p.sourceCiRunId))')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$source_ci_run_id" > "$CI_RUN_JSON"
      - name: Validate trusted staging run
        id: staging
        run: node scripts/validate-staging-run.mjs
      # What is promoted is a commit, not a file. Clever Cloud builds from the
      # git history it is pushed, so the artifact chain proves *which* commit
      # staging proved, and this checkout is that commit exactly.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.staging.outputs.sha }}
          clean: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the promoted commit
        env:
          STAGING_SHA: ${{ steps.staging.outputs.sha }}
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CHECKOUT_SHA
          node scripts/verify-promoted-commit.mjs
      - name: Link this checkout to the production application
        run: npx --yes clever-tools@latest link "$CLEVER_APP_NAME" --alias production
      - name: Record the database backups that exist before this promotion
        run: |
          npx --yes clever-tools@latest addon list --format json > "$RUNNER_TEMP/addons.json"
          id="$(node -e 'const fs=require("fs");const list=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/addons.json","utf8"));const a=list.find((x)=>x.name===process.env.CLEVER_APP_NAME+"-db");if(!a)process.exit(1);process.stdout.write(a.realId||a.id)')"
          npx --yes clever-tools@latest database backups "$id" --format json > "$BACKUPS_JSON" || echo '[]' > "$BACKUPS_JSON"
          {
            echo '### Backups available before this promotion'
            echo '```json'
            cat "$BACKUPS_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record previous deployment
        run: npx --yes clever-tools@latest activity --alias production > "$PREVIOUS_DEPLOYMENTS_JSON" || true
      # Before the deploy, not after: a migration that fails must fail the
      # promotion rather than take production down with it.
      - name: Apply migrations
        run: node scripts/migrate.mjs --addon "$CLEVER_APP_NAME-db"
      - name: Deploy
        run: >-
          npx --yes clever-tools@latest deploy --alias production
          --same-commit-policy restart
      - run: >-
          node scripts/smoke.mjs --base-url "$PRODUCTION_URL"
          --mode production --timeout-ms 300000
      - name: Record rollback guidance
        if: failure()
        run: |
          {
            echo '### Rollback guidance'
            echo 'Database backups taken before this promotion:'
            echo '```json'
            cat "$BACKUPS_JSON" 2>/dev/null || echo '[]'
            echo '```'
            echo 'Deployments before this promotion (the first line is the one to restore):'
            echo '```'
            cat "$PREVIOUS_DEPLOYMENTS_JSON" 2>/dev/null || echo 'none recorded'
            echo '```'
            echo 'Roll the application back by re-running this workflow with the previous'
            echo 'staging run id: promotion is a commit, so the previous commit is the rollback.'
            echo 'Restore the database only if a migration corrupted data:'
            echo '```bash'
            echo 'clever database backups <addon-id>'
            echo 'clever database backups download <addon-id> <backup-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
